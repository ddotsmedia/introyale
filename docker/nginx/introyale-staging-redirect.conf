# staging.introyale.online is retired (no staging environment): everything redirects to the production site.
server {
    listen 80;
    server_name staging.introyale.online;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://introyale.online$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name staging.introyale.online;
    ssl_certificate /etc/letsencrypt/live/staging.introyale.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.introyale.online/privkey.pem;
    return 301 https://introyale.online$request_uri;
}

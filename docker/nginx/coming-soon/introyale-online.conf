# introyale.online + www: static "Coming soon" page until production launch (M14). Host Nginx, no containers.
# Install: nginx -t && systemctl reload nginx (never a global restart). Replace this vhost with introyale.conf.template at launch.
server {
    listen 80;
    server_name introyale.online www.introyale.online;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://introyale.online$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name www.introyale.online;
    ssl_certificate /etc/letsencrypt/live/introyale.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/introyale.online/privkey.pem;
    return 301 https://introyale.online$request_uri;
}
server {
    listen 443 ssl http2;
    server_name introyale.online;
    ssl_certificate /etc/letsencrypt/live/introyale.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/introyale.online/privkey.pem;
    server_tokens off;
    root /var/www/introyale-coming-soon;
    index index.html;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location / { try_files $uri /index.html; }
}

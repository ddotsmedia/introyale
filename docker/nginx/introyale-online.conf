# Production vhost for introyale.online (host Nginx, Mode A). Apex serves the app; www redirects to the apex.
# Install: nginx -t && systemctl reload nginx (never a global restart; CLAUDE.md). Certificates: certbot webroot.
limit_req_zone $binary_remote_addr zone=introyale_enquiries:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=introyale_admin:10m rate=30r/m;

server {
    listen 80;
    server_name introyale.online www.introyale.online;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://introyale.online$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name www.introyale.online;
    ssl_certificate /etc/letsencrypt/live/introyale.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/introyale.online/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 301 https://introyale.online$request_uri;
}

server {
    listen 443 ssl http2;
    server_name introyale.online;
    ssl_certificate /etc/letsencrypt/live/introyale.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/introyale.online/privkey.pem;
    client_max_body_size 25m;
    server_tokens off;

    # HSTS (2 years, includeSubDomains) is sent by the app on proxied responses; /media/ adds its own below.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cross-Origin-Opener-Policy same-origin always;

    location /media/ {
        alias /home/introyale-deploy/introyale/production/media/;
        expires 1y;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /api/enquiries { limit_req zone=introyale_enquiries burst=3 nodelay; proxy_pass http://127.0.0.1:3140; include /etc/nginx/introyale-proxy.inc; }
    location ^~ /admin { limit_req zone=introyale_admin burst=20 nodelay; proxy_pass http://127.0.0.1:3140; include /etc/nginx/introyale-proxy.inc; }
    location = /api/users/login { limit_req zone=introyale_admin burst=5 nodelay; proxy_pass http://127.0.0.1:3140; include /etc/nginx/introyale-proxy.inc; }

    location / {
        proxy_pass http://127.0.0.1:3140;
        include /etc/nginx/introyale-proxy.inc;
    }
}

server:
  http_listen_port: 9080
positions:
  filename: /tmp/positions.yaml
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  # Docker container logs, JSON from the json-file driver. Only introyale* containers are shipped.
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/?(introyale-.*)'
        action: keep
        target_label: container
      - source_labels: ['__meta_docker_container_name']
        regex: '/?introyale-(.*)-\d+'
        target_label: service
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: msg

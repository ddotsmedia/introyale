# Shared monitoring (SPEC §2.1, D7). Separate Compose project: `docker compose -p ddots-ops -f ops/compose.yaml up -d`.
# Introyale never depends on this stack to run. Host ports are bound to 127.0.0.1 only.
# Image tags are pinned to major/minor; pin digests on the VPS after the first pull.
x-logging: &logging
  driver: json-file
  options: { max-size: '10m', max-file: '5' }

services:
  glitchtip-db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: glitchtip
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${GLITCHTIP_DB_PASSWORD}
    volumes: [glitchtip-db:/var/lib/postgresql/data]
    networks: [ops]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U glitchtip -d glitchtip"]
      interval: 10s
      retries: 5

  glitchtip-redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    networks: [ops]

  glitchtip:
    image: glitchtip/glitchtip:v5.0
    restart: unless-stopped
    logging: *logging
    depends_on:
      glitchtip-db: { condition: service_healthy }
    ports: ['127.0.0.1:8000:8000']
    environment:
      DATABASE_URL: postgres://glitchtip:${GLITCHTIP_DB_PASSWORD}@glitchtip-db:5432/glitchtip
      REDIS_URL: redis://glitchtip-redis:6379/0
      GLITCHTIP_DOMAIN: http://127.0.0.1:8000
      DEFAULT_FROM_EMAIL: alerts@introyale.invalid
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      USE_ASYNC_SERVER: "true"
    networks: [ops]

  glitchtip-worker:
    image: glitchtip/glitchtip:v5.0
    restart: unless-stopped
    logging: *logging
    depends_on:
      glitchtip-db: { condition: service_healthy }
    command: ["./bin/run-celery-with-beat.sh"]
    environment:
      DATABASE_URL: postgres://glitchtip:${GLITCHTIP_DB_PASSWORD}@glitchtip-db:5432/glitchtip
      REDIS_URL: redis://glitchtip-redis:6379/0
      GLITCHTIP_DOMAIN: http://127.0.0.1:8000
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
    networks: [ops]

  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    logging: *logging
    ports: ['127.0.0.1:3110:3100']
    command: ['-config.file=/etc/loki/config.yaml']
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    networks: [ops]

  promtail:
    image: grafana/promtail:3.4.2
    restart: unless-stopped
    logging: *logging
    command: ['-config.file=/etc/promtail/config.yaml']
    volumes:
      - ./promtail/config.yaml:/etc/promtail/config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks: [ops]

  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    logging: *logging
    ports: ['127.0.0.1:3300:3000']
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: 'false'
    secrets: [grafana_admin_password]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [ops]

  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    logging: *logging
    ports: ['127.0.0.1:3001:3001']
    volumes: [uptime-kuma-data:/app/data]
    networks: [ops]

secrets:
  grafana_admin_password: { file: ./secrets/grafana_admin_password.txt }

volumes:
  glitchtip-db:
  loki-data:
  grafana-data:
  uptime-kuma-data:

networks:
  ops: {}

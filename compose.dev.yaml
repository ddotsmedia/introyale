# Local development (Docker Desktop). Hot reload, Mailpit, DB reachable on 127.0.0.1 only.
services:
  web:
    build: { context: ., dockerfile: docker/web.Dockerfile, target: dev }
    image: introyale-web-dev:local
    read_only: false
    command: ["pnpm", "exec", "next", "dev", "--hostname", "0.0.0.0", "--port", "3000"]
    ports: ['127.0.0.1:3000:3000']
    volumes:
      - ./apps/web/src:/repo/apps/web/src
      - ./apps/web/tests:/repo/apps/web/tests
    environment:
      NODE_ENV: development

  migrate:
    build: { context: ., dockerfile: docker/web.Dockerfile, target: runtime }
    image: introyale-web:local

  worker:
    build: { context: ., dockerfile: docker/web.Dockerfile, target: runtime }
    image: introyale-web:local

  db:
    # Docker does not publish ports on internal networks, so dev adds a host-facing network.
    ports: ['127.0.0.1:55432:5432']
    networks: [internal, devhost]

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['127.0.0.1:8025:8025', '127.0.0.1:1025:1025']
    networks: [devhost, egress]

networks:
  devhost: {}

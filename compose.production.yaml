# Production overlay (Mode A default: host Nginx proxies 127.0.0.1:${WEB_PORT}). Use -p introyale-production.
services:
  web:
    image: ghcr.io/${GH_OWNER}/introyale-web:${IMAGE_TAG}
    ports: ['127.0.0.1:${WEB_PORT}:3000']
  worker:
    image: ghcr.io/${GH_OWNER}/introyale-web:${IMAGE_TAG}
  migrate:
    image: ghcr.io/${GH_OWNER}/introyale-web:${IMAGE_TAG}
  backup:
    image: ghcr.io/${GH_OWNER}/introyale-backup:${IMAGE_TAG}
    build: !reset null

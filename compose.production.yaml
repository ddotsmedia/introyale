# Production overlay (Mode A: host Nginx proxies 127.0.0.1:${WEB_PORT}). Always -p introyale-production.
# Per-host values (GH_OWNER, WEB_PORT, FEATURE_EMAIL) come from <base>/production/.env.compose.
# Optional SMTP settings live in secrets/smtp.env (SMTP_HOST, SMTP_PORT, SMTP_USER, MAIL_FROM, STAFF_EMAIL).
x-prod-env: &prod-env
  ENV: production
  PUBLIC_URL: https://introyale.online
  SITE_URL: https://introyale.online
  MEDIA_DIR: /media
  ROBOTS_NOINDEX: 'false'
  FEATURE_EMAIL: ${FEATURE_EMAIL:-false}
x-smtp: &smtp
  env_file:
    - { path: '${SECRETS_DIR}/smtp.env', required: false }
# Snap Docker's AppArmor profile makes every exec fail ("operation not permitted") when no-new-privileges is set, so the
# flag is dropped on this host. Compensating controls stay: cap_drop ALL, read-only root, non-root user (decisions-log).
x-no-nnp: &no-nnp
  security_opt: !reset []
services:
  db:
    <<: *no-nnp
  web:
    <<: *smtp
    security_opt: !reset []
    image: ghcr.io/${GH_OWNER}/introyale-web:${IMAGE_TAG}
    ports: ['127.0.0.1:${WEB_PORT}:3000']
    environment: *prod-env
  worker:
    <<: *smtp
    security_opt: !reset []
    image: ghcr.io/${GH_OWNER}/introyale-web:${IMAGE_TAG}
    environment: *prod-env
  migrate:
    <<: *no-nnp
    image: ghcr.io/${GH_OWNER}/introyale-web:${IMAGE_TAG}
    environment: *prod-env
  backup:
    <<: *no-nnp
    image: ghcr.io/${GH_OWNER}/introyale-backup:${IMAGE_TAG}
    build: !reset null

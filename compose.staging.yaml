# Staging overlay: basic auth and noindex are enforced at host Nginx; app also sends noindex headers.
# Per-host values (GH_OWNER, WEB_PORT, FEATURE_EMAIL) come from /opt/introyale/staging/.env.compose.
# Optional SMTP settings live in secrets/smtp.env (SMTP_HOST, SMTP_PORT, SMTP_USER, MAIL_FROM, STAFF_EMAIL).
x-staging-env: &staging-env
  ENV: staging
  PUBLIC_URL: https://staging.introyale.online
  SITE_URL: https://staging.introyale.online
  MEDIA_DIR: /media
  ROBOTS_NOINDEX: 'true'
  FEATURE_EMAIL: ${FEATURE_EMAIL:-false}
x-smtp: &smtp
  env_file:
    - { path: '${SECRETS_DIR}/smtp.env', required: false }
services:
  web:
    <<: *smtp
    image: ghcr.io/${GH_OWNER}/introyale-web:${IMAGE_TAG}
    ports: ['127.0.0.1:${WEB_PORT}:3000']
    environment: *staging-env
  worker:
    <<: *smtp
    image: ghcr.io/${GH_OWNER}/introyale-web:${IMAGE_TAG}
    environment: *staging-env
  migrate:
    image: ghcr.io/${GH_OWNER}/introyale-web:${IMAGE_TAG}
    environment: *staging-env
  backup:
    image: ghcr.io/${GH_OWNER}/introyale-backup:${IMAGE_TAG}
    build: !reset null

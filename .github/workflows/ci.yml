name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions: { contents: read, pull-requests: read } # least privilege; publish overrides for packages
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm -C apps/web build
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'false'
      - name: osv-scanner (lockfile)
        uses: google/osv-scanner-action/osv-scanner-action@v2.0.2
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml
            --skip-git
          fail-on-vuln: true

  image:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: build web image
        run: docker build -f docker/web.Dockerfile --target runtime -t introyale-web:ci .
      - name: build cli image
        run: docker build -f docker/web.Dockerfile --target cli -t introyale-cli:ci .
      - name: build backup image
        run: docker build -f docker/backup.Dockerfile -t introyale-backup:ci .
      - name: image size budgets (web 500, cli 400, backup 100 MB)
        run: |
          fail=0; { echo '| image | size MB | budget MB |'; echo '|---|---|---|'; } >> "$GITHUB_STEP_SUMMARY"
          for e in web:500 cli:400 backup:100; do
            n="${e%%:*}"; b="${e##*:}"; sz=$(( $(docker image inspect "introyale-$n:ci" --format '{{.Size}}') / 1000000 ))
            echo "| $n | $sz | $b |" >> "$GITHUB_STEP_SUMMARY"; echo "introyale-$n: $sz MB (budget $b)"
            [ "$sz" -le "$b" ] || { echo "::error::introyale-$n is $sz MB, over the $b MB budget"; fail=1; }
          done
          exit $fail
      - name: trivy (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: introyale-web:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          scanners: vuln,secret
      - name: trivy cli image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: introyale-cli:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          scanners: vuln,secret

  browser:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: compose test stack (db + migrate + web + mailpit, seeded)
        run: |
          export E2E_ADMIN_PW="$(openssl rand -hex 16)"
          echo "::add-mask::$E2E_ADMIN_PW"
          echo "E2E_ADMIN_PW=$E2E_ADMIN_PW" >> "$GITHUB_ENV"
          scripts/ci-stack.sh up
      - name: playwright + axe against the stack
        run: pnpm exec playwright test
        env:
          E2E_BASE_URL: http://127.0.0.1:3100
          MAILPIT_URL: http://127.0.0.1:8100
          ROBOTS_NOINDEX: 'true'
      - name: stack logs on failure
        if: failure()
        run: docker compose -p introyale-ci logs --tail=80 web
      - name: tear down
        if: always()
        run: scripts/ci-stack.sh down

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [verify, image, browser]
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          {
            registry: ghcr.io,
            username: '${{ github.actor }}',
            password: '${{ secrets.GITHUB_TOKEN }}',
          }
      - name: build and push images
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"; tag="${GITHUB_SHA::12}"
          docker build -f docker/web.Dockerfile --target runtime --label org.opencontainers.image.source=https://github.com/ddotsmedia/introyale -t "ghcr.io/$owner/introyale-web:$tag" .
          docker build -f docker/backup.Dockerfile --label org.opencontainers.image.source=https://github.com/ddotsmedia/introyale -t "ghcr.io/$owner/introyale-backup:$tag" .
          docker build -f docker/web.Dockerfile --target cli --label org.opencontainers.image.source=https://github.com/ddotsmedia/introyale -t "ghcr.io/$owner/introyale-cli:$tag" .
          docker push "ghcr.io/$owner/introyale-web:$tag"
          docker push "ghcr.io/$owner/introyale-cli:$tag"
          docker push "ghcr.io/$owner/introyale-backup:$tag"

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: publish
    concurrency: deploy-production
    permissions: { contents: read, packages: read } # token is used on the VPS for docker login (pull)
    steps:
      - name: deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          tag="${GITHUB_SHA::12}"
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "introyale-deploy@$VPS_HOST" \
            "trap 'docker logout ghcr.io >/dev/null 2>&1' EXIT; docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null 2>&1 && cd /home/introyale-deploy/introyale/production && { [ -d repo/.git ] || git clone -q git@github.com:ddotsmedia/introyale.git repo; } && cd repo && git fetch -q origin main && git checkout -q --force '${GITHUB_SHA}' && INTROYALE_BASE=/home/introyale-deploy/introyale bash scripts/deploy.sh production '$tag'"

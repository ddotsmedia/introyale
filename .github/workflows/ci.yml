name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm -C apps/web build
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      - name: osv-scanner (lockfile)
        uses: google/osv-scanner-action/osv-scanner-action@v2.0.2
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml
            --skip-git
          fail-on-vuln: true

  image:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: build web image
        run: docker build -f docker/web.Dockerfile --target runtime -t introyale-web:ci .
      - name: trivy (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: introyale-web:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          scanners: vuln,secret

  browser:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Browser tests run against a dev server; DB-backed suites need the compose test stack (M11).
      - run: pnpm exec playwright test apps/web/tests/a11y --project=desktop
        env:
          PAYLOAD_SECRET: ci-only-not-a-secret
          DATABASE_URL: postgres://ci:ci@127.0.0.1:1/ci
          PAYLOAD_MIGRATING: 'true'

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [verify, image]
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          {
            registry: ghcr.io,
            username: '${{ github.actor }}',
            password: '${{ secrets.GITHUB_TOKEN }}',
          }
      - name: build and push images
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"; tag="${GITHUB_SHA::12}"
          docker build -f docker/web.Dockerfile --target runtime -t "ghcr.io/$owner/introyale-web:$tag" .
          docker build -f docker/backup.Dockerfile -t "ghcr.io/$owner/introyale-backup:$tag" .
          docker push "ghcr.io/$owner/introyale-web:$tag"
          docker push "ghcr.io/$owner/introyale-backup:$tag"

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: publish
    concurrency: deploy-staging
    steps:
      - name: deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          tag="${GITHUB_SHA::12}"
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "introyale-deploy@$VPS_HOST" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null && cd /opt/introyale/staging && { [ -d repo/.git ] || git clone -q https://github.com/ddotsmedia/introyale.git repo; } && cd repo && git fetch -q origin main && git checkout -q --force '${GITHUB_SHA}' && scripts/deploy.sh staging '$tag'"
